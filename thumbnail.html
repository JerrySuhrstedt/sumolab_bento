<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
body{margin:0}
.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 90px}
.main{background:var(--color-primary);display:flex;align-items:center;justify-content:center}
.wordmark{font-family:var(--font-display);font-weight:500;font-style:italic;color:var(--color-ink-on-dark);font-size:150px;letter-spacing:0.01em}
.strip{display:flex;flex-direction:column}
.strip div{flex:1}
</style></head><body>
<div class="tile">
<div class="main"><div class="wordmark">SumoLab</div></div>
<div class="strip">
<div style="background:var(--teal-100)"></div>
<div style="background:var(--teal-600)"></div>
<div style="background:var(--teal-800)"></div>
<div style="background:var(--gold-500)"></div>
</div>
</div>
</body></html>

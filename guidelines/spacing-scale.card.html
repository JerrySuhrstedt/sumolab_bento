<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing Scale" subtitle="4px base scale, --sp-1 through --sp-10" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);font-size:11px;color:var(--color-ink-muted)}.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bar{background:var(--color-accent);height:14px}</style></head><body>
<div class="row"><div class="bar" style="width:var(--sp-1)"></div><span>sp-1 / 4px</span></div>
<div class="row"><div class="bar" style="width:var(--sp-2)"></div><span>sp-2 / 8px</span></div>
<div class="row"><div class="bar" style="width:var(--sp-3)"></div><span>sp-3 / 12px</span></div>
<div class="row"><div class="bar" style="width:var(--sp-4)"></div><span>sp-4 / 16px</span></div>
<div class="row"><div class="bar" style="width:var(--sp-5)"></div><span>sp-5 / 24px</span></div>
<div class="row"><div class="bar" style="width:var(--sp-6)"></div><span>sp-6 / 32px</span></div>
<div class="row"><div class="bar" style="width:var(--sp-7)"></div><span>sp-7 / 48px</span></div>
<div class="row"><div class="bar" style="width:var(--sp-8)"></div><span>sp-8 / 64px</span></div>
</body></html>

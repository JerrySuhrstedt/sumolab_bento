<!-- @dsCard group="Brand" viewport="700x160" name="Button & Hover Physics" subtitle="Solid fill darkens on hover, no scale/bounce" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;font-family:var(--font-body);display:flex;gap:16px;align-items:center}
button{font-family:var(--font-body);font-weight:600;border-radius:var(--radius-sm);border:1px solid transparent;padding:12px 22px;cursor:pointer;transition:background 120ms cubic-bezier(.4,0,.2,1)}
.p{background:var(--color-primary);color:#fff}.p:hover{background:var(--color-primary-hover)}
.s{background:transparent;color:var(--color-ink);border-color:var(--color-border-strong)}.s:hover{background:var(--color-surface-sunken)}
</style></head><body>
<button class="p">Book a Strategy Call →</button>
<button class="s">Learn more</button>
<span style="font-size:12px;color:var(--color-ink-muted)">Hover a button — flat color shift only, 120ms, no shadow pop or scale.</span>
</body></html>

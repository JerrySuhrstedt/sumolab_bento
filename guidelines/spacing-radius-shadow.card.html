<!-- @dsCard group="Spacing" viewport="700x180" name="Radius & Shadow" subtitle="Sharp small radii, soft ambient shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-body);font-size:12px;color:var(--color-ink-muted);display:flex;gap:20px}.box{width:100px;height:100px;background:var(--color-surface);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;border:1px solid var(--color-border)}</style></head><body>
<div class="box" style="border-radius:var(--radius-sm)">sm / 4px</div>
<div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-sm)">md + shadow-sm</div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-md)">lg + shadow-md</div>
<div class="box" style="border-radius:var(--radius-pill);box-shadow:var(--shadow-lg)">pill + shadow-lg</div>
</body></html>
